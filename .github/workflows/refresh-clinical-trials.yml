name: Refresh ClinicalTrials.gov evidence

on:
  push:
    branches:
      - main
    paths:
      - "scripts/refresh_clinical_trials.py"
      - ".github/workflows/refresh-clinical-trials.yml"
  schedule:
    - cron: "15 15 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Refresh NCT06264180 from ClinicalTrials.gov API v2
        run: python scripts/refresh_clinical_trials.py --nct-id NCT06264180
      - name: Rebuild canonical API
        run: python scripts/build_api.py
      - name: Validate refreshed evidence
        run: |
          python -m json.tool data/multiomics-v1.json > /dev/null
          python -m json.tool api/v1/multiomics/index.json > /dev/null
          python -m json.tool api/v1/multiomics/metrics.json > /dev/null
          python -m unittest discover -s tests -v
      - name: Commit changed primary evidence and derived views
        id: commit
        run: |
          evidence_status="$(git status --porcelain --untracked-files=all -- data/multiomics-v1.json data/raw/clinicaltrials api/v1/multiomics)"
          if [ -z "$evidence_status" ]; then
            echo "No ClinicalTrials.gov evidence change."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/multiomics-v1.json data/raw/clinicaltrials api/v1/multiomics
          git commit -m "data: refresh ClinicalTrials.gov evidence"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  validate-persisted:
    needs: refresh
    if: ${{ needs.refresh.outputs.changed == 'true' }}
    uses: ./.github/workflows/validate.yml
    with:
      ref: ${{ needs.refresh.outputs.commit_sha }}
    permissions:
      contents: read

  deploy-persisted:
    needs:
      - refresh
      - validate-persisted
    if: ${{ needs.refresh.outputs.changed == 'true' }}
    uses: ./.github/workflows/deploy-pages.yml
    with:
      ref: ${{ needs.refresh.outputs.commit_sha }}
    permissions:
      contents: read
      pages: write
      id-token: write
