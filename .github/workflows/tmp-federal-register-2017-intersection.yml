name: Temporary Federal Register 2017 intersection

on:
  push:
    branches:
      - research/federal-register-2017-bulk-intersection-20260910

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Measure correction-aware intersection
        run: |
          python - <<'PY'
          import html
          import json
          import re
          import urllib.request
          from pathlib import Path

          notice_url = "https://www.federalregister.gov/documents/2017/06/21/2017-12908/wyeth-pharmaceuticals-inc-et-al-withdrawal-of-approval-of-121-new-drug-applications-and-161"
          correction_url = "https://www.federalregister.gov/documents/2018/12/12/2018-26925/wyeth-pharmaceuticals-inc-et-al-withdrawal-of-approval-of-121-new-drug-applications-and-161"

          def fetch_text(url: str) -> str:
              req = urllib.request.Request(url, headers={"User-Agent": "KAFKA2306-multiomics-evidence-audit/1.0"})
              with urllib.request.urlopen(req, timeout=60) as response:
                  body = response.read().decode("utf-8", errors="strict")
              text = html.unescape(re.sub(r"<[^>]+>", " ", body))
              return re.sub(r"\s+", " ", text)

          notice = fetch_text(notice_url)
          correction = fetch_text(correction_url)
          withdrawn_apps = set(re.findall(r"\b(?:NDA|ANDA)\s+(\d{6})\b", notice))
          if len(withdrawn_apps) < 250:
              raise SystemExit(f"FAIL: parsed only {len(withdrawn_apps)} application numbers from 2017 notice")
          if "204508" not in correction or "still in effect" not in correction:
              raise SystemExit("FAIL: correction semantics for NDA 204508 not verified")
          corrected_still_effective = {"204508"}
          effective_withdrawn_apps = withdrawn_apps - corrected_still_effective

          analysis = json.loads(Path("api/v1/multiomics/fda-product-coverage-analysis.json").read_text())
          evidence = json.loads(Path("data/fda-orange-book-absence-primary-evidence.json").read_text())
          existing = {(r["application_number"], r["product_number"]) for r in evidence.get("records", [])}
          residual = [
              r for r in analysis["products"]
              if r["marketing_status"] != "None (Tentative Approval)"
              and (r["application_number"], r["product_number"]) not in existing
          ]
          hits = [r for r in residual if r["application_number"] in effective_withdrawn_apps]
          hits.sort(key=lambda r: (r["application_number"], r["product_number"]))
          result = {
              "source_notice_url": notice_url,
              "source_correction_url": correction_url,
              "parsed_notice_application_count": len(withdrawn_apps),
              "corrected_still_effective_applications": sorted(corrected_still_effective),
              "effective_withdrawn_application_count": len(effective_withdrawn_apps),
              "current_residual_product_count": len(residual),
              "hit_product_count": len(hits),
              "hit_application_count": len({r["application_number"] for r in hits}),
              "hits": hits,
          }
          Path("bulk-intersection.json").write_text(json.dumps(result, indent=2) + "\n")
          print(json.dumps({k: v for k, v in result.items() if k != "hits"}, indent=2))
          print("HITS")
          for row in hits:
              print(row["application_number"], row["product_number"], row["drug_name"], row["marketing_status"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: federal-register-2017-intersection
          path: bulk-intersection.json
