name: Temporary Federal Register withdrawal corpus intersection

on:
  push:
    branches:
      - research/federal-register-2017-bulk-intersection-20260910

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose and measure official corpus
        run: |
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request
          import urllib.error
          from pathlib import Path

          API = "https://www.federalregister.gov/api/v1"
          UA = "KAFKA2306-multiomics-evidence-audit/1.0"
          params = [("conditions[term]", "withdrawal of approval"), ("per_page", "1000")]
          url = API + "/documents.json?" + urllib.parse.urlencode(params)
          result = {"search_url": url, "status": "UNVERIFIED"}
          try:
              req = urllib.request.Request(url, headers={"User-Agent": UA, "Accept": "application/json"})
              with urllib.request.urlopen(req, timeout=60) as response:
                  result["http_status"] = response.status
                  payload = json.load(response)
              result["count"] = payload.get("count")
              result["result_count"] = len(payload.get("results", []))
              result["next_page_url"] = payload.get("next_page_url")
              result["sample"] = [
                  {k: row.get(k) for k in ("document_number", "title", "publication_date", "type", "html_url")}
                  for row in payload.get("results", [])[:5]
              ]
              result["status"] = "API_REACHABLE"
          except urllib.error.HTTPError as exc:
              result["http_status"] = exc.code
              result["error_body"] = exc.read().decode("utf-8", errors="replace")[:4000]
          except Exception as exc:
              result["error"] = repr(exc)
          Path("federal-register-corpus-diagnostic.json").write_text(json.dumps(result, indent=2) + "\n")
          print(json.dumps(result, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: federal-register-corpus-diagnostic
          path: federal-register-corpus-diagnostic.json
