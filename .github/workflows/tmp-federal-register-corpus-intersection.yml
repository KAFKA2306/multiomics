name: Temporary Federal Register withdrawal corpus intersection

on:
  push:
    branches:
      - research/federal-register-2017-bulk-intersection-20260910

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bulk-search residual applications in Federal Register
        run: |
          python - <<'PY'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import html
          import json
          import re
          import urllib.parse
          import urllib.request
          from pathlib import Path

          API = "https://www.federalregister.gov/api/v1"
          UA = "KAFKA2306-multiomics-evidence-audit/1.0"
          FIELDS = ["document_number", "title", "publication_date", "type", "html_url", "raw_text_url"]

          def get_json(url):
              req = urllib.request.Request(url, headers={"User-Agent": UA, "Accept": "application/json"})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          def get_text(url):
              req = urllib.request.Request(url, headers={"User-Agent": UA})
              with urllib.request.urlopen(req, timeout=30) as response:
                  raw = response.read().decode("utf-8", errors="replace")
              return re.sub(r"\s+", " ", html.unescape(re.sub(r"<[^>]+>", " ", raw)))

          analysis = json.loads(Path("api/v1/multiomics/fda-product-coverage-analysis.json").read_text())
          evidence = json.loads(Path("data/fda-orange-book-absence-primary-evidence.json").read_text())
          existing = {(r["application_number"], r["product_number"]) for r in evidence.get("records", [])}
          residual = [r for r in analysis["products"] if r["marketing_status"] != "None (Tentative Approval)" and (r["application_number"], r["product_number"]) not in existing]
          residual_by_app = {}
          for row in residual:
              residual_by_app.setdefault(row["application_number"], []).append(row)
          apps = sorted(residual_by_app)

          def search_app(app):
              term = str(int(app))
              params = [
                  ("conditions[term]", term),
                  ("conditions[agencies][]", "food-and-drug-administration"),
                  ("per_page", "100"),
              ] + [("fields[]", f) for f in FIELDS]
              url = API + "/documents.json?" + urllib.parse.urlencode(params)
              payload = get_json(url)
              docs = []
              for doc in payload.get("results", []):
                  title = (doc.get("title") or "").lower()
                  if "withdrawal of approval" not in title or "correction" in title:
                      continue
                  docs.append(doc)
              return app, docs

          search_failures = []
          candidate_doc_apps = {}
          with ThreadPoolExecutor(max_workers=32) as pool:
              futures = {pool.submit(search_app, app): app for app in apps}
              for future in as_completed(futures):
                  app = futures[future]
                  try:
                      _, docs = future.result()
                  except Exception as exc:
                      search_failures.append({"application_number": app, "error": repr(exc)})
                      continue
                  for doc in docs:
                      candidate_doc_apps.setdefault(doc["document_number"], {"doc": doc, "queried_apps": set()})["queried_apps"].add(app)
          if search_failures:
              raise SystemExit(f"FAIL: official API searches failed for {len(search_failures)} residual applications")

          verified_candidates = []
          body_failures = []
          def verify_doc(item):
              number, payload = item
              doc = payload["doc"]
              raw_url = doc.get("raw_text_url")
              if not raw_url:
                  detail = get_json(f"{API}/documents/{number}.json")
                  raw_url = detail.get("raw_text_url") or detail.get("body_html_url")
              if not raw_url:
                  return "failed", {"document_number": number, "error": "no official text URL"}
              try:
                  text = get_text(raw_url)
              except Exception as exc:
                  return "failed", {"document_number": number, "error": repr(exc)}
              body_apps = {a.zfill(6) for a in re.findall(r"\b(?:NDA|ANDA)\s+(?:No\.?\s*)?(\d{4,6})\b", text, re.IGNORECASE)}
              hits = sorted(body_apps & set(payload["queried_apps"]))
              if not hits:
                  return "none", None
              return "candidate", {
                  "document_number": number,
                  "title": doc.get("title"),
                  "publication_date": doc.get("publication_date"),
                  "html_url": doc.get("html_url"),
                  "raw_text_url": raw_url,
                  "hit_applications": hits,
              }

          with ThreadPoolExecutor(max_workers=16) as pool:
              futures = [pool.submit(verify_doc, item) for item in candidate_doc_apps.items()]
              for future in as_completed(futures):
                  kind, payload = future.result()
                  if kind == "candidate":
                      verified_candidates.append(payload)
                  elif kind == "failed":
                      body_failures.append(payload)
          if body_failures:
              raise SystemExit(f"FAIL: official text fetches failed for {len(body_failures)} candidate documents")
          verified_candidates.sort(key=lambda d: (d["publication_date"] or "", d["document_number"]))

          product_sources = {}
          unresolved_corrections = []
          resolved_candidates = []
          for candidate in verified_candidates:
              detail = get_json(f"{API}/documents/{candidate['document_number']}.json")
              corrections = detail.get("corrections") or []
              removed = set()
              unresolved = False
              correction_sources = []
              for corr in corrections:
                  corr_num = corr.get("document_number") if isinstance(corr, dict) else None
                  if not corr_num:
                      unresolved = True
                      continue
                  corr_detail = get_json(f"{API}/documents/{corr_num}.json")
                  corr_url = corr_detail.get("raw_text_url") or corr_detail.get("body_html_url")
                  if not corr_url:
                      unresolved = True
                      continue
                  corr_text = get_text(corr_url)
                  correction_sources.append({"document_number": corr_num, "html_url": corr_detail.get("html_url"), "publication_date": corr_detail.get("publication_date")})
                  for app in candidate["hit_applications"]:
                      pats = [
                          rf"entry\s+for\s+(?:NDA|ANDA)\s+0*{int(app)}\s+is\s+removed",
                          rf"approval\s+of\s+(?:NDA|ANDA)\s+0*{int(app)}\s+is\s+still\s+in\s+effect",
                      ]
                      if any(re.search(p, corr_text, re.IGNORECASE) for p in pats):
                          removed.add(app)
              if corrections and unresolved:
                  unresolved_corrections.append({**candidate, "corrections": correction_sources})
                  continue
              effective = set(candidate["hit_applications"]) - removed
              resolved_candidates.append({**candidate, "removed_by_correction": sorted(removed), "effective_hit_applications": sorted(effective), "corrections": correction_sources})
              for app in effective:
                  for row in residual_by_app[app]:
                      key = (row["application_number"], row["product_number"])
                      product_sources.setdefault(key, []).append({k: candidate[k] for k in ("document_number", "title", "publication_date", "html_url")})

          by_identity = {(r["application_number"], r["product_number"]): r for r in residual}
          hits = [{**by_identity[key], "sources": sources} for key, sources in sorted(product_sources.items())]
          result = {
              "authority": "Federal Register / U.S. Food and Drug Administration",
              "current_residual_product_count": len(residual),
              "current_residual_application_count": len(apps),
              "official_search_request_count": len(apps),
              "candidate_document_count_before_body_verification": len(candidate_doc_apps),
              "verified_candidate_document_count": len(verified_candidates),
              "unresolved_correction_document_count": len(unresolved_corrections),
              "hit_product_count": len(hits),
              "hit_application_count": len({r["application_number"] for r in hits}),
              "resolved_candidates": resolved_candidates,
              "unresolved_corrections": unresolved_corrections,
              "hits": hits,
          }
          Path("federal-register-corpus-intersection.json").write_text(json.dumps(result, indent=2) + "\n")
          print(json.dumps({k: v for k, v in result.items() if k not in {"resolved_candidates", "unresolved_corrections", "hits"}}, indent=2))
          for row in hits:
              print("HIT", row["application_number"], row["product_number"], row["drug_name"], row["marketing_status"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: federal-register-corpus-intersection
          path: federal-register-corpus-intersection.json
