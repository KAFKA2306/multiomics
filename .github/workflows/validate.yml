name: Validate multiomics data

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate syntax
        run: |
          python -m json.tool data/multiomics-v1.json > /dev/null
          python -m json.tool schema/multiomics-v1.schema.json > /dev/null
          python -m json.tool api/v1/multiomics/index.json > /dev/null
          python -m json.tool api/v1/multiomics/metrics.json > /dev/null
          python -m json.tool api/v1/multiomics/drugsfda-oncology-crosswalk.json > /dev/null
          if [ -f api/v1/multiomics/fda-product-identity-crosscheck.json ]; then python -m json.tool api/v1/multiomics/fda-product-identity-crosscheck.json > /dev/null; fi
          if [ -f api/v1/multiomics/fda-product-coverage-analysis.json ]; then python -m json.tool api/v1/multiomics/fda-product-coverage-analysis.json > /dev/null; fi
          if [ -f api/v1/multiomics/fda-product-coverage-evidence.json ]; then python -m json.tool api/v1/multiomics/fda-product-coverage-evidence.json > /dev/null; fi
          if [ -f data/drugsfda-source.json ]; then python -m json.tool data/drugsfda-source.json > /dev/null; fi
          if [ -f data/orange-book-source.json ]; then python -m json.tool data/orange-book-source.json > /dev/null; fi
          python -m py_compile scripts/analyze_fda_product_coverage.py scripts/analyze_sequencing_costs.py scripts/build_api.py scripts/refresh_clinical_trials.py scripts/refresh_drugsfda.py scripts/refresh_fda_approvals.py scripts/refresh_orange_book.py scripts/refresh_sequencing_costs.py tests/test_api.py tests/test_data.py tests/test_drugsfda_refresh.py tests/test_fda_product_coverage_analysis.py tests/test_fda_refresh.py tests/test_orange_book_refresh.py tests/test_pages.py tests/test_refresh.py tests/test_sequencing_analysis.py tests/test_sequencing_refresh.py
      - name: Rebuild derived views
        run: |
          python scripts/build_api.py
          python scripts/analyze_fda_product_coverage.py
          python scripts/analyze_sequencing_costs.py
          python -m json.tool api/v1/multiomics/drugsfda-oncology-crosswalk.json > /dev/null
          python -m json.tool api/v1/multiomics/fda-product-identity-crosscheck.json > /dev/null
          python -m json.tool api/v1/multiomics/fda-product-coverage-analysis.json > /dev/null
          python -m json.tool api/v1/multiomics/fda-product-coverage-evidence.json > /dev/null
          python -m json.tool api/v1/multiomics/sequencing-cost-analysis.json > /dev/null
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Verify tracked files unchanged
        run: git diff --exit-code
