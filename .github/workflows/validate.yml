name: Validate multiomics data

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate syntax
        run: |
          python -m json.tool data/multiomics-v1.json > /dev/null
          python -m json.tool schema/multiomics-v1.schema.json > /dev/null
          python -m json.tool api/v1/multiomics/index.json > /dev/null
          python -m json.tool api/v1/multiomics/metrics.json > /dev/null
          python -m py_compile scripts/build_api.py scripts/refresh_clinical_trials.py scripts/refresh_sequencing_costs.py tests/test_api.py tests/test_data.py tests/test_pages.py tests/test_refresh.py tests/test_sequencing_refresh.py
      - name: Rebuild canonical API
        run: python scripts/build_api.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Verify tracked files unchanged
        run: git diff --exit-code
