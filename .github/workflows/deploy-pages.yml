name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Build static artifact
        run: |
          rm -rf _site
          mkdir -p _site/data _site/api/v1/multiomics
          cp public/index.html _site/index.html
          cp data/multiomics-v1.json _site/data/multiomics-v1.json
          cp api/v1/multiomics/*.json _site/api/v1/multiomics/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify production API parity
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          mkdir -p /tmp/production-api
          for local_path in api/v1/multiomics/*.json; do
            name="$(basename "$local_path")"
            api_url="${SITE_URL%/}/api/v1/multiomics/$name"
            production_path="/tmp/production-api/$name"
            curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 "$api_url" -o "$production_path"
            python - "$local_path" "$production_path" <<'PY'
          import json
          import sys
          from pathlib import Path

          local_path = Path(sys.argv[1])
          production_path = Path(sys.argv[2])
          local = json.loads(local_path.read_text(encoding='utf-8'))
          production = json.loads(production_path.read_text(encoding='utf-8'))
          if production != local:
              raise SystemExit(f'production API differs from deployed canonical JSON: {local_path.name}')
          PY
          done
