name: Refresh primary-source evidence

on:
  push:
    branches:
      - main
    paths:
      - "scripts/analyze_fda_product_coverage.py"
      - "scripts/analyze_sequencing_costs.py"
      - "scripts/build_api.py"
      - "scripts/build_regulatory_decision_support.py"
      - "scripts/refresh_clinical_trials.py"
      - "scripts/refresh_drugsfda.py"
      - "scripts/refresh_fda_approvals.py"
      - "scripts/refresh_orange_book.py"
      - "scripts/refresh_sequencing_costs.py"
      - "data/fda-confirmatory-trial-requirements.json"
      - "tests/test_api.py"
      - "tests/test_data.py"
      - "tests/test_drugsfda_refresh.py"
      - "tests/test_fda_product_coverage_analysis.py"
      - "tests/test_fda_refresh.py"
      - "tests/test_orange_book_refresh.py"
      - "tests/test_refresh.py"
      - "tests/test_sequencing_analysis.py"
      - "tests/test_sequencing_refresh.py"
      - ".github/workflows/refresh-primary-sources.yml"
  schedule:
    - cron: "15 15 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install official workbook reader
        run: python -m pip install xlrd==2.0.2
      - name: Refresh NCT06264180 from ClinicalTrials.gov API v2
        run: python scripts/refresh_clinical_trials.py --nct-id NCT06264180
      - name: Refresh Drugs@FDA official data files
        run: python scripts/refresh_drugsfda.py
      - name: Refresh Orange Book official data files
        run: python scripts/refresh_orange_book.py
      - name: Refresh oncology approvals from FDA
        run: python scripts/refresh_fda_approvals.py
      - name: Refresh sequencing costs from NHGRI
        run: python scripts/refresh_sequencing_costs.py
      - name: Rebuild derived views
        run: |
          python scripts/build_api.py
          python scripts/build_regulatory_decision_support.py
          python scripts/analyze_fda_product_coverage.py
          python scripts/analyze_sequencing_costs.py
      - name: Validate refreshed evidence
        run: |
          python -m json.tool data/multiomics-v1.json > /dev/null
          python -m json.tool data/drugsfda-source.json > /dev/null
          python -m json.tool data/orange-book-source.json > /dev/null
          python -m json.tool data/fda-confirmatory-trial-requirements.json > /dev/null
          python -m json.tool api/v1/multiomics/index.json > /dev/null
          python -m json.tool api/v1/multiomics/metrics.json > /dev/null
          python -m json.tool api/v1/multiomics/drugsfda-oncology-crosswalk.json > /dev/null
          python -m json.tool api/v1/multiomics/fda-product-identity-crosscheck.json > /dev/null
          python -m json.tool api/v1/multiomics/fda-product-coverage-analysis.json > /dev/null
          python -m json.tool api/v1/multiomics/accelerated-approval-confirmatory-trials.json > /dev/null
          python -m json.tool api/v1/multiomics/sequencing-cost-analysis.json > /dev/null
          python -m unittest discover -s tests -v
      - name: Commit changed primary evidence and derived views
        id: commit
        run: |
          evidence_status="$(git status --porcelain --untracked-files=all -- data/multiomics-v1.json data/drugsfda-source.json data/orange-book-source.json data/fda-confirmatory-trial-requirements.json data/raw/clinicaltrials data/raw/fda data/raw/nhgri api/v1/multiomics)"
          if [ -z "$evidence_status" ]; then
            echo "No primary-source evidence or derived-view change."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/multiomics-v1.json data/drugsfda-source.json data/orange-book-source.json data/fda-confirmatory-trial-requirements.json data/raw/clinicaltrials data/raw/fda data/raw/nhgri api/v1/multiomics
          git commit -m "data: refresh primary-source evidence"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  validate-persisted:
    needs: refresh
    if: ${{ needs.refresh.outputs.changed == 'true' }}
    uses: ./.github/workflows/validate.yml
    with:
      ref: ${{ needs.refresh.outputs.commit_sha }}
    permissions:
      contents: read

  deploy-persisted:
    needs:
      - refresh
      - validate-persisted
    if: ${{ needs.refresh.outputs.changed == 'true' }}
    uses: ./.github/workflows/deploy-pages.yml
    with:
      ref: ${{ needs.refresh.outputs.commit_sha }}
    permissions:
      contents: read
      pages: write
      id-token: write
